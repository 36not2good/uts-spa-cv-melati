<div class="contact-section">
    <h2>Contact Me</h2>
    <p class="contact-desc">
        Hubungi saya melalui form di bawah ini ✨
    </p>

    <div class="contact-layout">
        <form class="contact-form" id="contactForm">
            <input type="text" id="name" placeholder="Nama Lengkap">
            <small id="nameError" class="error-text"></small>

            <input type="email" id="email" placeholder="Email">
            <small id="emailError" class="error-text"></small>

            <textarea id="message" rows="5" placeholder="Tulis pesan kamu di sini..."></textarea>
            <small id="messageError" class="error-text"></small>

            <button type="submit">Kirim Pesan</button>

            <p id="successMessage" class="success-text"></p>
        </form>

        <div class="contact-info">
            <h3>Info Kontak</h3>
            <p>📧 melati@gmail.com</p>
            <p>📱 0812345678910</p>
            <p>📍 Rancaekek, Jawa Barat</p>
        </div>
    </div>
</div>
